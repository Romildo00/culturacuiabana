<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição confirmada!</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/custom.css">
</head>
<body>
  <header class="header-logos">
    <span style="color:#fff;font-weight:700;font-size:1.1rem">ENERGISA</span>
    <div class="divider"></div>
    <span style="color:#fff;font-weight:700;font-size:1.1rem">SENAI</span>
  </header>

  <main class="container py-5" style="position:relative;z-index:1;max-width:520px">
    <div class="card-cuiaba text-center">
      <div style="font-size:2.5rem;margin-bottom:.5rem">🎉</div>
      <h1 style="font-size:1.4rem;font-weight:700;color:var(--verde);margin-bottom:.5rem">Inscrição confirmada!</h1>
      <p style="color:#555">Olá, <strong>{{ participante.nome }}</strong>! Sua presença está garantida.</p>
      <p style="color:#888;font-size:.85rem;margin-top:.25rem">{{ participante.email }}</p>
      <hr style="border-color:var(--terracota);opacity:.3;margin:1.5rem 0">
      <a href="/feedback" class="btn-feedback d-inline-block text-decoration-none">Avaliar o evento</a>
    </div>
  </main>
</body>
</html>
